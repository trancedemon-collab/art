<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Multi-Character Pose & Animation Studio</title>
<style>
  :root {
    --bg-base: #242424;
    --border-color: #383838;
    --header-bg: #1e1e1e;
    --text-color: #eeeeec;
    --btn-bg: #3a3a3a;
    --btn-hover: #454545;
    --accent: #3584e4;
    --accent-hover: #1c71d8;
    --danger: #e01b24;
    --setpose-color: #ff9500;
    --timeline-bg: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-base);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    height: 48px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 10;
  }
  .header-group { display: flex; align-items: center; gap: 6px; }
  button, label.file-btn, select, input[type="text"], input[type="number"] {
    background: var(--btn-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 11px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  input[type="text"], input[type="number"] { cursor: text; }
  button:hover, label.file-btn:hover, select:hover { background: var(--btn-hover); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.accent { background: var(--accent); color: #fff; border-color: rgba(0,0,0,0.2); }
  button.accent:hover { background: var(--accent-hover); }
  button.danger { background: var(--danger); color: #fff; }
  button.active { background: #2ec27e; color: #fff; }
  button.setpose-active { background: var(--setpose-color); color: #fff; border-color: rgba(0,0,0,0.2); font-weight: 600; }
  
  #viewport { flex: 1; position: relative; }
  #fileInputRig, #fileInputProp, #fileInputJSON, #fileInputAnimJSON, #fileInputAnimGLB { display: none; }
  
  #statusOverlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(25, 25, 25, 0.95);
    padding: 16px 28px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    font-size: 13px;
    pointer-events: none;
    display: none;
    z-index: 100;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  #arcCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .floating-panel {
    position: absolute;
    background: rgba(30, 30, 30, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    z-index: 15;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  
  /* Relocated control panel to bottom-left corner with tucked dual rows */
  #panelControls {
    bottom: 12px;
    left: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 540px;
  }
  .panel-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  #panelLibrary {
    top: 56px;
    right: 16px;
    width: 240px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel-title { font-weight: 600; font-size: 11px; padding-bottom: 4px; border-bottom: 1px solid var(--border-color); }
  .control-group { display: flex; align-items: center; gap: 6px; }
  .control-group label { opacity: 0.85; }
  input[type="range"] { accent-color: var(--accent); cursor: pointer; }
  input[type="color"] { border: none; width: 24px; height: 22px; padding: 0; background: transparent; cursor: pointer; }

  /* Timeline Bottom Panel */
  #timelinePanel {
    height: 108px;
    background: var(--timeline-bg);
    border-top: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 8px 16px;
    gap: 8px;
    z-index: 20;
  }
  .timeline-bar-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    width: 100%;
  }
  #timelineSlider {
    flex: 1;
    height: 6px;
  }
  #keyframeMarkers {
    position: absolute;
    left: 0;
    right: 130px;
    top: -6px;
    height: 6px;
    pointer-events: none;
  }
  .kf-tick {
    position: absolute;
    width: 3px;
    height: 8px;
    background: var(--setpose-color);
    border-radius: 1px;
    transform: translateX(-50%);
  }
  .timeline-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  #modalJSON {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    max-width: 90vw;
    background: var(--header-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 50;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #modalJSON textarea {
    width: 100%;
    height: 240px;
    background: var(--bg-base);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 8px;
    font-family: monospace;
    font-size: 11px;
    resize: vertical;
    outline: none;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header>
  <div class="header-group">
    <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
    <button id="btnAddCarmilla" class="accent">+ Carmilla</button>
    <button id="btnAddLexa" class="accent">+ Lexa Drake</button>
    <button id="btnAddUrl">URL GLB...</button>
    <label class="file-btn" for="fileInputRig">+ Local Rig</label>
    <input type="file" id="fileInputRig" accept=".glb,.gltf">
    <label class="file-btn" for="fileInputProp">+ Prop</label>
    <input type="file" id="fileInputProp" accept=".glb,.gltf">
  </div>
  <div class="header-group">
    <select id="renderStyle">
      <option value="silhouette">Silhouette</option>
      <option value="textured" selected>Textured & Lit</option>
      <option value="cartoon">2D Cartoon (Cel)</option>
      <option value="sketch">2D Sketch Style</option>
      <option value="wireframe">3D Wireframe</option>
      <option value="clay">Clay Model</option>
    </select>
    <button id="btnJSONModal">AI / JSON Pose</button>
    <button id="btnCopy">Copy Image</button>
    <button id="btnExport" class="accent">Export Still</button>
  </div>
</header>

<div id="viewport">
  <div id="statusOverlay">Processing...</div>
  <canvas id="arcCanvas"></canvas>

  <!-- Relocated to Bottom-Left Corner -->
  <div id="panelControls" class="floating-panel">
    <div class="panel-row">
      <div class="control-group">
        <label>Active:</label>
        <select id="activeCharSelect"></select>
        <button id="btnRemoveChar" class="danger">Remove</button>
      </div>
      <div class="control-group">
        <label>Control:</label>
        <button id="btnControlSystem" class="setpose-active">SetPose (Arcball)</button>
      </div>
      <div class="control-group" id="gizmoSubControls" style="display: none;">
        <button id="btnControlTarget">Joints Mode</button>
        <button id="btnGizmoAction">Rotate (R)</button>
      </div>
      <div class="control-group">
        <button id="btnFaceEachOther" title="Turn models to face one another">Face Selected</button>
      </div>
      <div class="control-group">
        <button id="btnResetPose">Reset Pose</button>
      </div>
    </div>

    <div class="panel-row">
      <div class="control-group">
        <label>Color:</label>
        <input type="color" id="charSilhouetteColor" value="#111618">
      </div>
      <div class="control-group">
        <label>Scale:</label>
        <input type="range" id="charScaleSlider" min="0.2" max="2.5" step="0.05" value="1.0" style="width: 60px;">
      </div>
      <div class="control-group">
        <label>Align:</label>
        <button id="btnAlignGround">Ground</button>
        <button id="btnAlignX">X</button>
        <button id="btnAlignZ">Z</button>
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="chkConstraints" checked> Anti-Twist</label>
        <label><input type="checkbox" id="chkLowPower" checked> Eco</label>
      </div>
    </div>
  </div>

  <div id="panelLibrary" class="floating-panel">
    <div class="panel-title">Pose Library (Active Model)</div>
    <div class="control-group" style="justify-content: space-between;">
      <button id="btnSaveLocal" style="flex: 1;">Save Current</button>
      <button id="btnLoadSelected" class="accent">Load</button>
      <button id="btnDeletePose">Delete</button>
    </div>
    <select id="poseList" size="3" style="width: 100%; height: 50px; background: var(--bg-base); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px;"></select>
    <div class="control-group" style="justify-content: space-between;">
      <button id="btnExportFile" style="flex: 1;">Export .JSON</button>
      <label class="file-btn" for="fileInputJSON" style="flex: 1; justify-content: center;">Import .JSON</label>
      <input type="file" id="fileInputJSON" accept=".json">
    </div>
  </div>
</div>

<!-- Timeline & Animation Suite -->
<div id="timelinePanel">
  <div class="timeline-bar-wrap">
    <div id="keyframeMarkers"></div>
    <input type="range" id="timelineSlider" min="0" max="60" value="0" step="1">
    <span id="frameCounter" style="font-family: monospace; font-size: 11px; width: 110px; text-align: right;">Frame: 0 / 60</span>
  </div>

  <div class="timeline-controls">
    <div class="header-group">
      <button id="btnPlayAnim">▶ Play</button>
      <button id="btnLoopAnim" class="active">🔁 Loop</button>
      <button id="btnAddKeyframe" class="accent">◆ Set Key</button>
      <button id="btnDeleteKeyframe" class="danger">◇ Del Key</button>
      <button id="btnClearAnimation">Clear</button>

      <!-- Import external animation files -->
      <label class="file-btn" for="fileInputAnimGLB" title="Load an external GLB animation and transfer it to the active character">Transfer Anim GLB</label>
      <input type="file" id="fileInputAnimGLB" accept=".glb,.gltf">

      <label class="file-btn" for="fileInputAnimJSON" title="Import keyframes from animation JSON">Import Anim JSON</label>
      <input type="file" id="fileInputAnimJSON" accept=".json">
    </div>

    <div class="header-group">
      <label>FPS:</label>
      <select id="animFps">
        <option value="12">12</option>
        <option value="24" selected>24</option>
        <option value="30">30</option>
        <option value="60">60</option>
      </select>
      <label>Frames:</label>
      <input type="number" id="totalFramesInput" min="10" max="600" value="60" style="width: 50px;">
      
      <!-- Export Options -->
      <button id="btnExportAnimJSON" title="Save keyframes as JSON">Save Anim JSON</button>
      <button id="btnExportGLB" class="accent" title="Export current character + animation to a standard GLB file">Export Anim GLB</button>
      <button id="btnExportSequence">ZIP (Images)</button>
      <button id="btnExportVideo" class="accent">Export Video</button>
    </div>
  </div>
</div>

<div id="modalJSON">
  <div class="panel-title">AI Pose Template & Exchange</div>
  <p style="font-size: 11px; opacity: 0.8;">
    Copy JSON to prompt AI for pose updates, or paste an AI pose and click Apply:
  </p>
  <textarea id="jsonArea" spellcheck="false"></textarea>
  <div class="modal-actions">
    <button id="btnCopyPrompt">Copy Prompt + JSON</button>
    <button id="btnApplyJSON" class="accent">Apply Pose</button>
    <button id="btnCloseModal">Close</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const CARMILLA_URL = 'https://trancedemon-collab.github.io/my_apps/glb/carmilla.glb';
const LEXA_URL = 'https://trancedemon-collab.github.io/my_apps/glb/Lexa_Drake.glb';

const viewport = document.getElementById('viewport');
const statusOverlay = document.getElementById('statusOverlay');
const arcCanvas = document.getElementById('arcCanvas');
const arcCtx = arcCanvas.getContext('2d');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd6d6d6);

const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 100);
camera.position.set(0, 1.3, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: "low-power" });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.setPixelRatio(1.0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
viewport.appendChild(renderer.domElement);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.95, 0);
orbit.update();

const transform = new TransformControls(camera, renderer.domElement);
transform.size = 0.65;
transform.setMode('rotate');
scene.add(transform);

const ikTargetMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.02, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0xff3b30, visible: false })
);
scene.add(ikTargetMesh);

let needsRender = true;
function requestRender() { needsRender = true; }
orbit.addEventListener('change', requestRender);

let currentSystem = 'setpose';
let currentControlTarget = 'joint';
let currentGizmoAction = 'rotate';

const btnControlSystem = document.getElementById('btnControlSystem');
const gizmoSubControls = document.getElementById('gizmoSubControls');

btnControlSystem.addEventListener('click', () => {
  if (currentSystem === 'setpose') {
    currentSystem = 'gizmo';
    btnControlSystem.innerText = 'Classic Gizmo';
    btnControlSystem.classList.remove('setpose-active');
    btnControlSystem.classList.add('accent');
    gizmoSubControls.style.display = 'flex';
  } else {
    currentSystem = 'setpose';
    btnControlSystem.innerText = 'SetPose (Arcball)';
    btnControlSystem.classList.remove('accent');
    btnControlSystem.classList.add('setpose-active');
    gizmoSubControls.style.display = 'none';
    transform.detach();
  }
  requestRender();
});

const grid = new THREE.GridHelper(10, 20, 0x777777, 0xaaaaaa);
grid.receiveShadow = true;
scene.add(grid);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(2, 4, 3);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const characters = [];
let activeCharIndex = -1;
let activeBone = null;
const propsList = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const clayMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.6 });
const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x111618, wireframe: true });
const cartoonMat = new THREE.MeshToonMaterial({
  color: 0xe0e0e0,
  gradientMap: (() => {
    const colors = new Uint8Array([0, 0, 0, 128, 128, 128, 255, 255, 255]);
    const tex = new THREE.DataTexture(colors, 3, 1, THREE.RedFormat);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.needsUpdate = true;
    return tex;
  })()
});

const sketchMat = new THREE.ShaderMaterial({
  uniforms: { uLightDir: { value: new THREE.Vector3(0.5, 0.8, 0.5).normalize() } },
  vertexShader: `
    varying vec3 vNormal;
    varying vec2 vUv;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vUv = uv * 30.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    varying vec2 vUv;
    uniform vec3 uLightDir;
    void main() {
      float intensity = dot(vNormal, uLightDir);
      float pattern = 1.0;
      if (intensity < 0.7) {
        if (mod(vUv.x + vUv.y, 2.0) > 1.0) pattern *= 0.6;
      }
      if (intensity < 0.4) {
        if (mod(vUv.x - vUv.y, 2.0) > 1.0) pattern *= 0.4;
      }
      if (intensity < 0.15) pattern = 0.1;
      gl_FragColor = vec4(vec3(pattern), 1.0);
    }
  `
});

const CONE_LIMITS = {
  'Arm': 85 * (Math.PI / 180),
  'ForeArm': 140 * (Math.PI / 180),
  'UpLeg': 90 * (Math.PI / 180),
  'Knee': 145 * (Math.PI / 180),
  'Leg': 145 * (Math.PI / 180),
  'Neck': 40 * (Math.PI / 180),
  'Head': 45 * (Math.PI / 180),
  'Spine': 30 * (Math.PI / 180)
};

function enforceBoneLimits(bone, initialTransforms) {
  const initial = initialTransforms.get(bone);
  if (!initial) return;
  for (const [key, maxAngle] of Object.entries(CONE_LIMITS)) {
    if (bone.name.includes(key)) {
      const dot = THREE.MathUtils.clamp(bone.quaternion.dot(initial.quaternion), -1, 1);
      const angle = 2 * Math.acos(Math.abs(dot));
      if (angle > maxAngle) {
        bone.quaternion.rotateTowards(initial.quaternion, angle - maxAngle);
      }
      break;
    }
  }
}

function getActiveCharacter() {
  return characters[activeCharIndex] || null;
}

function updateCharSelectUI() {
  const select = document.getElementById('activeCharSelect');
  select.innerHTML = '';
  characters.forEach((char, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.innerText = `${idx + 1}: ${char.name}`;
    select.appendChild(opt);
  });
  if (activeCharIndex >= 0 && activeCharIndex < characters.length) {
    select.value = activeCharIndex;
    const char = characters[activeCharIndex];
    document.getElementById('charSilhouetteColor').value = char.silhouetteColor;
    document.getElementById('charScaleSlider').value = char.root.scale.x;
  }
  refreshPoseList();
  renderTimelineKeyframeMarkers();
}

document.getElementById('activeCharSelect').addEventListener('change', (e) => {
  activeCharIndex = parseInt(e.target.value, 10);
  activeBone = null;
  transform.detach();
  updateCharSelectUI();
  requestRender();
});

document.getElementById('btnRemoveChar').addEventListener('click', () => {
  if (activeCharIndex < 0 || activeCharIndex >= characters.length) return;
  const char = characters[activeCharIndex];
  scene.remove(char.root);
  char.jointHandles.forEach(h => scene.remove(h));
  characters.splice(activeCharIndex, 1);
  transform.detach();
  activeBone = null;
  activeCharIndex = characters.length - 1;
  updateCharSelectUI();
  requestRender();
});

document.getElementById('charScaleSlider').addEventListener('input', (e) => {
  const char = getActiveCharacter();
  if (!char) return;
  const s = parseFloat(e.target.value);
  char.root.scale.set(s, s, s);
  char.root.updateMatrixWorld(true);
  updateHandlesPositions();
  requestRender();
});

document.getElementById('btnAlignGround').addEventListener('click', () => {
  const char = getActiveCharacter();
  if (!char) return;
  pushUndoState();
  const box = new THREE.Box3().setFromObject(char.root);
  char.root.position.y -= box.min.y;
  char.root.updateMatrixWorld(true);
  updateHandlesPositions();
  requestRender();
});

document.getElementById('btnAlignX').addEventListener('click', () => {
  const char = getActiveCharacter();
  if (!char) return;
  pushUndoState();
  const box = new THREE.Box3().setFromObject(char.root);
  const center = box.getCenter(new THREE.Vector3());
  char.root.position.x -= center.x;
  char.root.updateMatrixWorld(true);
  updateHandlesPositions();
  requestRender();
});

document.getElementById('btnAlignZ').addEventListener('click', () => {
  const char = getActiveCharacter();
  if (!char) return;
  pushUndoState();
  const box = new THREE.Box3().setFromObject(char.root);
  const center = box.getCenter(new THREE.Vector3());
  char.root.position.z -= center.z;
  char.root.updateMatrixWorld(true);
  updateHandlesPositions();
  requestRender();
});

document.getElementById('charSilhouetteColor').addEventListener('input', (e) => {
  const char = getActiveCharacter();
  if (!char) return;
  char.silhouetteColor = e.target.value;
  char.silhouetteMat.color.set(char.silhouetteColor);
  requestRender();
});

document.getElementById('btnFaceEachOther').addEventListener('click', () => {
  if (characters.length < 2) {
    alert('Add at least two characters to use this feature.');
    return;
  }
  const char = getActiveCharacter();
  if (!char) return;
  pushUndoState();
  const otherIndex = (activeCharIndex === 0) ? 1 : 0;
  const otherChar = characters[otherIndex];
  const targetVec = new THREE.Vector3();
  otherChar.root.getWorldPosition(targetVec);
  targetVec.y = char.root.position.y;
  char.root.lookAt(targetVec);
  char.root.updateMatrixWorld(true);
  updateHandlesPositions();
  requestRender();
});

const loader = new GLTFLoader();

function addCharacterFromGLTF(gltf, name) {
  const root = gltf.scene;
  root.name = name;
  if (characters.length > 0) {
    root.position.x += (characters.length % 2 === 1 ? 1 : -1) * 0.75 * Math.ceil(characters.length / 2);
  }
  const charData = {
    name: name,
    root: root,
    jointHandles: [],
    originalMaterials: new Map(),
    initialBoneTransforms: new Map(),
    boneMap: new Map(),
    skinnedMeshes: [],
    silhouetteColor: characters.length === 0 ? "#111618" : "#8b1818",
    silhouetteMat: new THREE.MeshBasicMaterial({ color: characters.length === 0 ? 0x111618 : 0x8b1818 }),
    keyframes: new Map()
  };

  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const handleRadius = Math.max(size.y * 0.014, 0.022);

  root.traverse((child) => {
    if (child.isMesh || child.isSkinnedMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      charData.originalMaterials.set(child, child.material);
      charData.skinnedMeshes.push(child);
    }
    if (child.isBone) {
      charData.boneMap.set(child.name, child);
      charData.initialBoneTransforms.set(child, {
        position: child.position.clone(),
        quaternion: child.quaternion.clone()
      });
      const handle = new THREE.Mesh(
        new THREE.SphereGeometry(handleRadius, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x3584e4, wireframe: true, depthTest: false })
      );
      handle.renderOrder = 999;
      handle.userData.bone = child;
      handle.userData.charData = charData;
      scene.add(handle);
      charData.jointHandles.push(handle);
    }
  });

  scene.add(root);
  characters.push(charData);
  activeCharIndex = characters.length - 1;

  applyShadingStyle(document.getElementById('renderStyle').value);
  updateCharSelectUI();
  updateHandlesPositions();
  requestRender();
}

// SetPose Direct Drag
let isSetPoseDragging = false;
let setPoseBone = null;
let setPoseChar = null;
let dragStartPoint = { x: 0, y: 0 };
let currentDragPoint = { x: 0, y: 0 };
let initialBoneQuat = new THREE.Quaternion();
let boneWorldPos = new THREE.Vector3();
let boneScreenPos = new THREE.Vector2();

function updateScreenCoords(worldVec, screenVec) {
  const temp = worldVec.clone().project(camera);
  screenVec.x = (temp.x * 0.5 + 0.5) * viewport.clientWidth;
  screenVec.y = (-(temp.y * 0.5) + 0.5) * viewport.clientHeight;
}

function drawSetPoseOverlay() {
  arcCtx.clearRect(0, 0, arcCanvas.width, arcCanvas.height);
  if (!isSetPoseDragging || !setPoseBone) return;

  const cx = boneScreenPos.x;
  const cy = boneScreenPos.y;
  const mx = currentDragPoint.x;
  const my = currentDragPoint.y;
  const dx = mx - cx;
  const dy = my - cy;
  const currentRadius = Math.hypot(dx, dy);
  const startAngle = Math.atan2(dragStartPoint.y - cy, dragStartPoint.x - cx);
  const endAngle = Math.atan2(dy, dx);

  arcCtx.beginPath();
  arcCtx.arc(cx, cy, 60, 0, Math.PI * 2);
  arcCtx.strokeStyle = "rgba(255, 149, 0, 0.25)";
  arcCtx.lineWidth = 2;
  arcCtx.stroke();

  arcCtx.beginPath();
  arcCtx.moveTo(cx, cy);
  arcCtx.arc(cx, cy, Math.max(30, Math.min(currentRadius, 100)), startAngle, endAngle, false);
  arcCtx.closePath();
  arcCtx.fillStyle = "rgba(255, 149, 0, 0.2)";
  arcCtx.fill();

  arcCtx.beginPath();
  arcCtx.moveTo(cx, cy);
  arcCtx.lineTo(mx, my);
  arcCtx.strokeStyle = "#ff9500";
  arcCtx.lineWidth = 2.5;
  arcCtx.stroke();

  arcCtx.beginPath();
  arcCtx.arc(cx, cy, 5, 0, Math.PI * 2);
  arcCtx.fillStyle = "#ffffff";
  arcCtx.fill();
  arcCtx.strokeStyle = "#ff9500";
  arcCtx.lineWidth = 2;
  arcCtx.stroke();
}

function resizeArcCanvas() {
  arcCanvas.width = viewport.clientWidth;
  arcCanvas.height = viewport.clientHeight;
}
resizeArcCanvas();
window.addEventListener('resize', resizeArcCanvas);

viewport.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const propHits = raycaster.intersectObjects(propsList, true);
  if (propHits.length > 0) {
    let topProp = propHits[0].object;
    while (topProp.parent && topProp.parent !== scene) topProp = topProp.parent;
    activeBone = null;
    transform.attach(topProp);
    transform.setMode('translate');
    requestRender();
    return;
  }

  const allHandles = characters.flatMap(c => c.jointHandles);
  const hits = raycaster.intersectObjects(allHandles);
  if (hits.length > 0) {
    const handleObj = hits[0].object;
    activeBone = handleObj.userData.bone;
    const char = handleObj.userData.charData;
    activeCharIndex = characters.indexOf(char);
    updateCharSelectUI();

    if (currentSystem === 'setpose') {
      isSetPoseDragging = true;
      setPoseBone = activeBone;
      setPoseChar = char;
      dragStartPoint.x = e.clientX - rect.left;
      dragStartPoint.y = e.clientY - rect.top;
      currentDragPoint.x = dragStartPoint.x;
      currentDragPoint.y = dragStartPoint.y;
      initialBoneQuat.copy(setPoseBone.quaternion);
      setPoseBone.getWorldPosition(boneWorldPos);
      updateScreenCoords(boneWorldPos, boneScreenPos);
      orbit.enabled = false;
      pushUndoState();
      drawSetPoseOverlay();
      requestRender();
      return;
    } else {
      if (currentControlTarget === 'global') {
        transform.attach(char.root);
        transform.setMode(currentGizmoAction);
      } else {
        const isRoot = !activeBone.parent || !activeBone.parent.isBone;
        if (currentGizmoAction === 'translate' && !isRoot) {
          activeBone.getWorldPosition(ikTargetMesh.position);
          transform.attach(ikTargetMesh);
          transform.setMode('translate');
        } else {
          transform.attach(activeBone);
          transform.setMode(isRoot ? 'translate' : currentGizmoAction);
        }
      }
      requestRender();
    }
  }
});

window.addEventListener('pointermove', (e) => {
  if (isSetPoseDragging && setPoseBone) {
    const rect = renderer.domElement.getBoundingClientRect();
    currentDragPoint.x = e.clientX - rect.left;
    currentDragPoint.y = e.clientY - rect.top;
    const deltaX = currentDragPoint.x - dragStartPoint.x;
    const deltaY = currentDragPoint.y - dragStartPoint.y;

    const rotSpeed = 0.008;
    const cameraUp = camera.up.clone().applyQuaternion(camera.quaternion);
    const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

    const qYaw = new THREE.Quaternion().setFromAxisAngle(cameraUp, deltaX * rotSpeed);
    const qPitch = new THREE.Quaternion().setFromAxisAngle(cameraRight, deltaY * rotSpeed);
    const qDeltaWorld = new THREE.Quaternion().multiplyQuaternions(qYaw, qPitch);

    const parentWorldQuat = setPoseBone.parent ? setPoseBone.parent.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion();
    const invParent = parentWorldQuat.clone().invert();
    const qDeltaLocal = new THREE.Quaternion()
      .copy(invParent)
      .multiply(qDeltaWorld)
      .multiply(parentWorldQuat);

    setPoseBone.quaternion.copy(qDeltaLocal.multiply(initialBoneQuat));

    if (document.getElementById('chkConstraints').checked) {
      enforceBoneLimits(setPoseBone, setPoseChar.initialBoneTransforms);
    }

    setPoseChar.root.traverse(c => {
      if (c.isBone) c.updateMatrixWorld(true);
    });

    updateHandlesPositions();
    drawSetPoseOverlay();
    requestRender();
  }
});

window.addEventListener('pointerup', () => {
  if (isSetPoseDragging) {
    isSetPoseDragging = false;
    setPoseBone = null;
    orbit.enabled = true;
    arcCtx.clearRect(0, 0, arcCanvas.width, arcCanvas.height);
    requestRender();
  }
});

// Undo / Redo
const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 30;

function pushUndoState() {
  const state = characters.map(c => captureCharPose(c));
  undoStack.push(state);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  updateUndoRedoUI();
}

function updateUndoRedoUI() {
  document.getElementById('btnUndo').disabled = (undoStack.length === 0);
  document.getElementById('btnRedo').disabled = (redoStack.length === 0);
}

document.getElementById('btnUndo').addEventListener('click', () => {
  if (undoStack.length === 0) return;
  redoStack.push(characters.map(c => captureCharPose(c)));
  const state = undoStack.pop();
  applyMultiCharState(state);
  updateUndoRedoUI();
});

document.getElementById('btnRedo').addEventListener('click', () => {
  if (redoStack.length === 0) return;
  undoStack.push(characters.map(c => captureCharPose(c)));
  const state = redoStack.pop();
  applyMultiCharState(state);
  updateUndoRedoUI();
});

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('btnUndo').click();
  } else if (((e.ctrlKey || e.metaKey) && e.key === 'y') || ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Z')) {

    document.getElementById('btnRedo').click();

});

// Serialization
function captureCharPose(char) {
  const pose = {
    format: "pose_3d_v1",
    charName: char.name,
    scale: char.root.scale.x,
    position: [char.root.position.x, char.root.position.y, char.root.position.z],
    rotation: [char.root.quaternion.x, char.root.quaternion.y, char.root.quaternion.z, char.root.quaternion.w],
    bones: {}
  };
  char.initialBoneTransforms.forEach((_, bone) => {
    pose.bones[bone.name] = {
      p: [parseFloat(bone.position.x.toFixed(4)), parseFloat(bone.position.y.toFixed(4)), parseFloat(bone.position.z.toFixed(4))],
      q: [parseFloat(bone.quaternion.x.toFixed(4)), parseFloat(bone.quaternion.y.toFixed(4)), parseFloat(bone.quaternion.z.toFixed(4)), parseFloat(bone.quaternion.w.toFixed(4))]
    };
  });
  return pose;
}

function applyCharPose(char, poseObj) {
  if (!char || !poseObj || !poseObj.bones) return;
  if (poseObj.scale) char.root.scale.set(poseObj.scale, poseObj.scale, poseObj.scale);
  if (poseObj.position) char.root.position.set(poseObj.position[0], poseObj.position[1], poseObj.position[2]);
  if (poseObj.rotation) char.root.quaternion.set(poseObj.rotation[0], poseObj.rotation[1], poseObj.rotation[2], poseObj.rotation[3]);
  for (const [name, b] of Object.entries(poseObj.bones)) {
    const bone = char.boneMap.get(name);
    if (bone) {
      bone.position.set(b.p[0], b.p[1], b.p[2]);
      bone.quaternion.set(b.q[0], b.q[1], b.q[2], b.q[3]);
      bone.updateMatrixWorld(true);
    }
  }
  char.root.traverse(c => {
    if (c.isBone) c.updateMatrixWorld(true);
    if (c.isSkinnedMesh && c.skeleton) c.skeleton.update();
  });
}

function applyMultiCharState(stateArr) {
  stateArr.forEach((poseObj, idx) => {
    if (characters[idx]) applyCharPose(characters[idx], poseObj);
  });
  updateHandlesPositions();
  requestRender();
}

    bone.quaternion.copy(val.quaternion);
    bone.updateMatrixWorld(true);
  });
  transform.detach();
  activeBone = null;

});

// SLERP Interpolator
const tmpQ1 = new THREE.Quaternion();
const tmpQ2 = new THREE.Quaternion();
const tmpV1 = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();

function applyAnimationPoseAtFrame(frame) {
  characters.forEach(char => {
    const keys = Array.from(char.keyframes.keys()).sort((a, b) => a - b);
    if (keys.length === 0) return;

    if (char.keyframes.has(frame)) {
      applyCharPose(char, char.keyframes.get(frame));
      return;
    }

    if (frame <= keys[0]) {
      applyCharPose(char, char.keyframes.get(keys[0]));
      return;
    }
    if (frame >= keys[keys.length - 1]) {
      applyCharPose(char, char.keyframes.get(keys[keys.length - 1]));
      return;
    }

    let prevKey = keys[0];
    let nextKey = keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i++) {
      if (frame > keys[i] && frame < keys[i + 1]) {
        prevKey = keys[i];
        nextKey = keys[i + 1];
        break;
      }
    }

    const alpha = (frame - prevKey) / (nextKey - prevKey);
    const poseA = char.keyframes.get(prevKey);
    const poseB = char.keyframes.get(nextKey);

    tmpV1.fromArray(poseA.position);
    tmpV2.fromArray(poseB.position);
    char.root.position.lerpVectors(tmpV1, tmpV2, alpha);

    tmpQ1.fromArray(poseA.rotation);
    tmpQ2.fromArray(poseB.rotation);
    char.root.quaternion.copy(tmpQ1).slerp(tmpQ2, alpha);

    for (const [name, bA] of Object.entries(poseA.bones)) {
      const bB = poseB.bones[name];
      const bone = char.boneMap.get(name);
      if (bone && bB) {
        tmpV1.fromArray(bA.p);
        tmpV2.fromArray(bB.p);
        bone.position.lerpVectors(tmpV1, tmpV2, alpha);

        tmpQ1.fromArray(bA.q);
        tmpQ2.fromArray(bB.q);
        bone.quaternion.copy(tmpQ1).slerp(tmpQ2, alpha);
      }
    }

    char.root.traverse(c => {
      if (c.isBone) c.updateMatrixWorld(true);
      if (c.isSkinnedMesh && c.skeleton) c.skeleton.update();
    });
  });

  updateHandlesPositions();
}

// ==========================================
// ANIMATION JSON EXPORT / IMPORT
// ==========================================
document.getElementById('btnExportAnimJSON').addEventListener('click', () => {
  const char = getActiveCharacter();
  if (!char) return;
  const animData = {
    format: "anim_3d_v1",
    charName: char.name,
    totalFrames: totalFrames,
    fps: parseInt(document.getElementById('animFps').value, 10) || 24,
    keyframes: {}
  };
  char.keyframes.forEach((pose, frame) => {
    animData.keyframes[frame] = pose;
  });

  const blob = new Blob([JSON.stringify(animData, null, 2)], { type: "application/json" });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${char.name}-animation-${Date.now()}.json`;
  link.click();
});

document.getElementById('fileInputAnimJSON').addEventListener('change', (e) => {
  const char = getActiveCharacter();
  const file = e.target.files[0];
  if (!file || !char) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const animData = JSON.parse(evt.target.result);
      if (!animData.keyframes) throw new Error("Invalid format");
      if (animData.totalFrames) {
        totalFrames = animData.totalFrames;
        totalFramesInput.value = totalFrames;
        timelineSlider.max = totalFrames;
      }
      char.keyframes.clear();
      for (const [frameStr, pose] of Object.entries(animData.keyframes)) {
        char.keyframes.set(parseInt(frameStr, 10), pose);
      }
      renderTimelineKeyframeMarkers();
      applyAnimationPoseAtFrame(currentFrame);
      requestRender();
      alert(`Imported animation for ${char.name}!`);
    } catch (err) {
      alert("Failed to parse animation JSON.");
    }
  };
  reader.readAsText(file);
});

// ==========================================
// ANIMATION RETARGETING (IMPORT DUMMY GLB)
// ==========================================
document.getElementById('fileInputAnimGLB').addEventListener('change', (e) => {
  const char = getActiveCharacter();
  const file = e.target.files[0];
  if (!file || !char) return;

  statusOverlay.style.display = 'block';
  statusOverlay.innerText = 'Extracting external animation...';

  const reader = new FileReader();
  reader.onload = (evt) => {
    loader.parse(evt.target.result, '', (gltf) => {
      if (!gltf.animations || gltf.animations.length === 0) {
        alert('No animation tracks found in this GLB file.');
        statusOverlay.style.display = 'none';
        return;
      }

      const clip = gltf.animations[0];
      const fps = parseInt(document.getElementById('animFps').value, 10) || 24;
      const calculatedFrames = Math.max(10, Math.ceil(clip.duration * fps));
      
      totalFrames = calculatedFrames;
      totalFramesInput.value = totalFrames;
      timelineSlider.max = totalFrames;

      // Temp mixer for sampling
      const tempMixer = new THREE.AnimationMixer(gltf.scene);
      const action = tempMixer.clipAction(clip);
      action.play();

      // Build keyframe dictionary for current char
      char.keyframes.clear();

      for (let f = 0; f <= totalFrames; f++) {
        const t = (f / totalFrames) * clip.duration;
        tempMixer.setTime(t);
        gltf.scene.updateMatrixWorld(true);

        // Map matching bones by name
        const samplePose = {
          format: "pose_3d_v1",
          charName: char.name,
          scale: char.root.scale.x,
          position: [char.root.position.x, char.root.position.y, char.root.position.z],
          rotation: [char.root.quaternion.x, char.root.quaternion.y, char.root.quaternion.z, char.root.quaternion.w],
          bones: {}
        };

        gltf.scene.traverse((sourceBone) => {
          if (sourceBone.isBone) {
            // Find corresponding bone in character
            let targetBone = char.boneMap.get(sourceBone.name);
            if (!targetBone) {
              // Fuzzy prefix match (e.g., Mixamo rigs with prefixes like "mixamorig:")
              const cleanName = sourceBone.name.split(':').pop();
              for (const [bName, bObj] of char.boneMap.entries()) {
                if (bName.endsWith(cleanName)) {
                  targetBone = bObj;
                  break;
                }
              }
            }

            if (targetBone) {
              samplePose.bones[targetBone.name] = {
                p: [sourceBone.position.x, sourceBone.position.y, sourceBone.position.z],
                q: [sourceBone.quaternion.x, sourceBone.quaternion.y, sourceBone.quaternion.z, sourceBone.quaternion.w]
              };
            }
          }
        });

        char.keyframes.set(f, samplePose);
      }

      renderTimelineKeyframeMarkers();
      applyAnimationPoseAtFrame(0);
      statusOverlay.style.display = 'none';
      requestRender();
      alert(`Inherited ${clip.name || 'Animation'} (${totalFrames} frames) successfully!`);
    });
  };
  reader.readAsArrayBuffer(file);
});

// ==========================================
// EXPORT ANIMATED GLB
// ==========================================
document.getElementById('btnExportGLB').addEventListener('click', () => {
  const char = getActiveCharacter();
  if (!char) return;

  statusOverlay.style.display = 'block';
  statusOverlay.innerText = 'Baking animation tracks and packaging GLB...';

  const fps = parseInt(document.getElementById('animFps').value, 10) || 24;
  const duration = totalFrames / fps;
  const tracks = [];

  // Generate bone tracks from keyframes
  const times = [];
  for (let f = 0; f <= totalFrames; f++) {
    times.push(f / fps);
  }

  // Sample bone tracks
  char.initialBoneTransforms.forEach((_, bone) => {
    const qValues = [];
    const pValues = [];

    for (let f = 0; f <= totalFrames; f++) {
      applyAnimationPoseAtFrame(f);
      qValues.push(bone.quaternion.x, bone.quaternion.y, bone.quaternion.z, bone.quaternion.w);
      pValues.push(bone.position.x, bone.position.y, bone.position.z);
    }

    tracks.push(new THREE.QuaternionKeyframeTrack(`${bone.name}.quaternion`, times, qValues));
    tracks.push(new THREE.VectorKeyframeTrack(`${bone.name}.position`, times, pValues));
  });

  const animClip = new THREE.AnimationClip(`${char.name}_Action`, duration, tracks);

  const exporter = new GLTFExporter();
  exporter.parse(
    char.root,
    (gltfBuffer) => {
      const blob = new Blob([gltfBuffer], { type: 'model/gltf-binary' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${char.name}-animated-${Date.now()}.glb`;
      link.click();

      statusOverlay.style.display = 'none';
      applyAnimationPoseAtFrame(currentFrame);
      requestRender();
    },
    (err) => {
      alert('Error exporting GLB: ' + err);
      statusOverlay.style.display = 'none';
    },
    { binary: true, animations: [animClip] }
  );
});

// ==========================================
// EXPORT PIPELINES (ZIP & VIDEO)
// ==========================================
document.getElementById('btnExportSequence').addEventListener('click', async () => {
  pausePlayback();
  statusOverlay.style.display = 'block';
  statusOverlay.innerText = 'Compiling Image Sequence (.ZIP)...';

  const zip = new JSZip();
  const prevGrid = grid.visible;
  grid.visible = false;
  transform.detach();
  characters.forEach(c => c.jointHandles.forEach(h => h.visible = false));
  arcCtx.clearRect(0, 0, arcCanvas.width, arcCanvas.height);

  for (let f = 0; f <= totalFrames; f++) {
    statusOverlay.innerText = `Rendering frame ${f} / ${totalFrames}...`;
    applyAnimationPoseAtFrame(f);
    renderer.render(scene, camera);

    const dataUrl = renderer.domElement.toDataURL('image/png');
    const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
    const padFrame = String(f).padStart(4, '0');
    zip.file(`frame_${padFrame}.png`, base64Data, { base64: true });
    await new Promise(res => setTimeout(res, 8));
  }

  statusOverlay.innerText = 'Compressing archive...';
  const content = await zip.generateAsync({ type: "blob" });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(content);
  link.download = `animation-sequence-${Date.now()}.zip`;
  link.click();

  grid.visible = prevGrid;
  characters.forEach(c => c.jointHandles.forEach(h => h.visible = true));
  statusOverlay.style.display = 'none';
  applyAnimationPoseAtFrame(currentFrame);
  requestRender();
});

document.getElementById('btnExportVideo').addEventListener('click', async () => {
  pausePlayback();
  statusOverlay.style.display = 'block';
  statusOverlay.innerText = 'Recording Video Buffer...';

  const fps = parseInt(document.getElementById('animFps').value, 10) || 24;
  const prevGrid = grid.visible;
  grid.visible = false;
  transform.detach();
  characters.forEach(c => c.jointHandles.forEach(h => h.visible = false));
  arcCtx.clearRect(0, 0, arcCanvas.width, arcCanvas.height);

  const stream = renderer.domElement.captureStream(fps);
  let mimeType = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm';
  }

  const recorder = new MediaRecorder(stream, { mimeType: mimeType });
  const chunks = [];

  recorder.ondataavailable = (e) => {
    if (e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `animation-${Date.now()}.webm`;
    link.click();

    grid.visible = prevGrid;
    characters.forEach(c => c.jointHandles.forEach(h => h.visible = true));
    statusOverlay.style.display = 'none';
    applyAnimationPoseAtFrame(currentFrame);
    requestRender();
  };

  recorder.start();

  const frameInterval = 1000 / fps;
  for (let f = 0; f <= totalFrames; f++) {
    statusOverlay.innerText = `Recording frame ${f} / ${totalFrames}...`;
    applyAnimationPoseAtFrame(f);
    renderer.render(scene, camera);
    await new Promise(res => setTimeout(res, frameInterval));
  }

  recorder.stop();
});

const chkLowPower = document.getElementById('chkLowPower');
function animate() {
  requestAnimationFrame(animate);
  if (isPlaying || needsRender || !chkLowPower.checked) {
    updateHandlesPositions();
    renderer.render(scene, camera);
    needsRender = false;
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = viewport.clientWidth / viewport.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  resizeArcCanvas();
  requestRender();
});

loadModelUrl(CARMILLA_URL, 'Carmilla');
